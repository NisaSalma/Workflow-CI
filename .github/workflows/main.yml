name: CI-MLflow

on:
  push:
    branches: [ "main" ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow
          pip install -r Workflow-CI/requirements.txt

      - name: Debug files
        run: |
          ls
          ls Workflow-CI
          cat Workflow-CI/MLproject

      - name: Run MLflow Project (NO CONDA)
        run: |
          cd Workflow-CI
          mlflow run . --env-manager=local
